<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Meta Tags -->
    <title>KingTechSol - Digital Transformation & Software Development Solutions</title>
    <meta name="title" content="DevMetaSol - Digital Transformation & Software Development Solutions" />
    <meta name="description" content="DevMetaSol - Leading digital transformation and software development company. We deliver enterprise-grade software solutions, cloud infrastructure, AI/ML solutions, and digital transformation services worldwide." />
    <meta name="keywords" content="software development, digital transformation, cloud services, web development, mobile app development, DevMetaSol, enterprise solutions, IT consulting, custom software, AI solutions, machine learning, cloud infrastructure, staff augmentation, digital marketing" />
    <meta name="author" content="DevMetaSol" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://devmetasol.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1e3a5f" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="msapplication-TileColor" content="#1e3a5f" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devmetasol.com/" />
    <meta property="og:title" content="DevMetaSol - Digital Transformation & Software Development" />
    <meta property="og:description" content="Leading digital transformation and software development company delivering enterprise-grade solutions, cloud infrastructure, and AI-powered innovations." />
    <meta property="og:image" content="https://devmetasol.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevMetaSol - Digital Transformation Solutions" />
    <meta property="og:site_name" content="DevMetaSol" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://devmetasol.com/" />
    <meta name="twitter:title" content="DevMetaSol - Digital Transformation & Software Development" />
    <meta name="twitter:description" content="Leading digital transformation and software development company delivering enterprise-grade solutions." />
    <meta name="twitter:image" content="https://devmetasol.com/og-image.png" />
    <meta name="twitter:site" content="@devmetasol" />
    <meta name="twitter:creator" content="@devmetasol" />

    <!-- Additional SEO Meta Tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevMetaSol" />
    <meta name="application-name" content="DevMetaSol" />

    <!-- Geo Tags (update with actual location) -->
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />

    <!-- Language -->
    <link rel="alternate" hreflang="en" href="https://devmetasol.com/" />
    <link rel="alternate" hreflang="x-default" href="https://devmetasol.com/" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DevMetaSol",
      "url": "https://devmetasol.com",
      "logo": "https://devmetasol.com/logo.png",
      "description": "Leading digital transformation and software development company delivering enterprise-grade solutions.",
      "foundingDate": "2020",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+92-330-4527519",
        "contactType": "customer service",
        "email": "Careers@devmetasol.com",
        "availableLanguage": ["English"]
      },
      "sameAs": [
        "https://www.linkedin.com/company/devmetasol",
        "https://twitter.com/devmetasol",
        "https://www.facebook.com/devmetasol"
      ]
    }
    </script>

    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DevMetaSol",
      "url": "https://devmetasol.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://devmetasol.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #f8d7da; color: #721c24;">
        You need to enable JavaScript to run this application. DevMetaSol provides enterprise-grade software development and digital transformation services.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
